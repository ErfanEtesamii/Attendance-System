<!doctype html><html lang="fa" dir="rtl" data-theme="light"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><link rel="stylesheet" href="/css/tokens.css"><link rel="stylesheet" href="/admin/css/style.css"><title>Styleguide</title></head><body><main class="page"><h1>راهنمای ظاهر پنل</h1><div class="view-header"><div><h2>تایپوگرافی و رنگ</h2><p class="muted">نمونه‌های توسعه‌ای؛ در production سرو نمی‌شود.</p></div><button class="btn ghost" id="theme">تغییر تم</button></div><div class="grid-2"><section class="card"><h3>دکمه‌ها</h3><p><button class="btn primary">اقدام اصلی</button> <button class="btn ghost">ثانویه</button> <button class="btn danger">خطر</button></p><h3>badge و ورودی</h3><span class="badge present">حاضر</span> <span class="badge late">تاخیر</span><p><input placeholder="ورودی نمونه"></p></section><section class="card"><h3>کارت و جدول</h3><div class="table-wrap"><table><thead><tr><th>نام</th><th>وضعیت</th></tr></thead><tbody><tr><td>کارمند نمونه</td><td>فعال</td></tr></tbody></table></div></section></div><section class="card"><h3>رنگ‌های معنایی</h3><div class="legend"><span><i class="lg-a"></i>برند</span><span><i class="lg-b"></i>هشدار</span></div></section></main><script>document.querySelector('#theme').onclick=()=>document.documentElement.dataset.theme=document.documentElement.dataset.theme==='dark'?'light':'dark';</script></body></html>
