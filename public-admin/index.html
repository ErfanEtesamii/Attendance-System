<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<meta name="theme-color" content="#1b1c2c" />
<title>پنل حضور و غیاب فرازهنر</title>
<link rel="stylesheet" href="/admin/css/style.css" />
<link rel="stylesheet" href="/admin/css/datepicker.css" />
</head>
<body>

  <!-- صفحه ورود -->
  <div id="login-screen" class="login-screen">
    <div class="login-card">
      <div class="brand brand-center">
        <div class="brand-mark">
          <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></svg>
        </div>
      </div>
      <h1>پنل حضور و غیاب</h1>
      <p class="muted">برای ورود، در بات دکمه‌ی «🖥 پنل» را بزنید، یا با حساب تلگرامی که در بات ثبت شده وارد شوید.</p>
      <div id="telegram-login-container"></div>
      <div class="code-login" style="margin-top:20px">
        <p class="muted">یا در بات دستور <code>/panel</code> را بزنید و کد ورود را اینجا وارد کنید:</p>
        <input id="code-input" type="text" inputmode="numeric" maxlength="8" autocomplete="one-time-code" placeholder="کد ۸ رقمی" dir="ltr" style="width:100%;padding:12px;border-radius:10px;text-align:center;font-size:18px;letter-spacing:4px">
        <button id="code-login-btn" type="button" style="width:100%;margin-top:10px;padding:12px;border-radius:10px;border:0;cursor:pointer;font-size:15px">ورود با کد</button>
      </div>
      <p id="login-error" class="error-msg"></p>
    </div>
  </div>

  <!-- برنامه اصلی -->
  <div id="app-shell" class="app-shell hidden">

    <div id="sidebar-backdrop" class="sidebar-backdrop"></div>
    <aside class="sidebar" id="sidebar">
      <div class="brand">
        <div class="brand-mark">
          <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></svg>
        </div>
        <div>
          <div class="brand-name">فرازهنر</div>
          <div class="brand-sub">پنل مدیریتی</div>
        </div>
      </div>

      <nav class="side-nav" id="side-nav"></nav>

      <div class="sidebar-footer">
        <div class="me-box">
          <div class="avatar" id="me-avatar">—</div>
          <div class="me-text">
            <div class="me-name" id="me-name">—</div>
            <div class="me-role" id="me-role">—</div>
          </div>
        </div>
        <button id="logout-btn" class="icon-btn" title="خروج" aria-label="خروج">
          <svg viewBox="0 0 24 24"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4M16 17l5-5-5-5M21 12H9"/></svg>
        </button>
      </div>
    </aside>

    <div class="content">
      <header class="topbar">
        <button id="menu-btn" class="icon-btn menu-btn" aria-label="منو">
          <svg viewBox="0 0 24 24"><path d="M3 6h18M3 12h18M3 18h18"/></svg>
        </button>
        <div class="search-box">
          <svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="M21 21l-4.3-4.3"/></svg>
          <input id="global-search" type="search" placeholder="جستجوی کارمند (نام یا کد پرسنلی)…" autocomplete="off" />
          <div id="search-results" class="search-results hidden"></div>
        </div>
        <div class="topbar-date" id="topbar-date"></div>
        <button id="bell-btn" class="icon-btn bell-btn hidden" type="button" title="اعلان‌ها" aria-label="اعلان‌ها" aria-haspopup="dialog" aria-expanded="false" aria-controls="bell-drawer">
          <svg viewBox="0 0 24 24"><path d="M18 8a6 6 0 0 0-12 0c0 7-3 9-3 9h18s-3-2-3-9M13.7 21a2 2 0 0 1-3.4 0"/></svg>
          <span id="bell-count" class="bell-count hidden" aria-hidden="true"></span>
        </button>
        <button id="refresh-btn" class="icon-btn" title="تازه‌سازی" aria-label="تازه‌سازی">
          <svg viewBox="0 0 24 24"><path d="M21 12a9 9 0 1 1-3-6.7L21 8M21 3v5h-5"/></svg>
        </button>
      </header>

      <main class="page" id="page"></main>
    </div>
  </div>

  <!-- زنگوله‌ی اعلان: پنل کشویی (S4-6a؛ منطق در js/bell.js) -->
  <div id="bell-backdrop" class="bell-backdrop"></div>
  <aside id="bell-drawer" class="bell-drawer" role="dialog" aria-modal="false" aria-labelledby="bell-title" aria-hidden="true">
    <div class="bell-head">
      <h3 id="bell-title">اعلان‌ها</h3>
      <button id="bell-mark-all" type="button" class="btn ghost small" disabled>خواندن همه</button>
      <button id="bell-close" type="button" class="icon-btn" aria-label="بستن">
        <svg viewBox="0 0 24 24"><path d="M18 6L6 18M6 6l12 12"/></svg>
      </button>
    </div>
    <div id="bell-list" class="bell-list" aria-live="polite"></div>
    <div class="bell-foot"><button id="bell-more" type="button" class="btn ghost small hidden">نمایش بیشتر</button></div>
  </aside>

  <div id="modal-root"></div>
  <div id="toast" class="toast hidden"></div>

  <script src="/admin/js/jalali.js"></script>
  <script src="/admin/js/datepicker.js"></script>
  <script src="/admin/js/core.js"></script>
  <script src="/admin/js/views-main.js"></script>
  <script src="/admin/js/views-ops.js"></script>
  <script src="/admin/js/views-admin.js"></script>
  <script src="/admin/js/views-shifts.js"></script>
  <script src="/admin/js/bell.js"></script>
  <script src="/admin/js/boot.js"></script>
</body>
</html>
